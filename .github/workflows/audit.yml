name: audit

on:
  push:
    paths: ["Cargo.lock", "Cargo.toml", ".github/workflows/audit.yml"]
  pull_request:
    paths: ["Cargo.lock", "Cargo.toml"]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        # The four rustls 0.23.45 advisories are ignored until the rustls
        # 0.23.46 update; warden does not reach them (see SECURITY.md).
        # hickory-proto 0.26.1 is outside RUSTSEC-2026-0118 and -0119.
        run: >-
          cargo audit
          --ignore RUSTSEC-2026-0346 --ignore RUSTSEC-2026-0347
          --ignore RUSTSEC-2026-0348 --ignore RUSTSEC-2026-0349
